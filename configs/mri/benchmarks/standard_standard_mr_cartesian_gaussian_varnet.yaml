modality: mri
algorithm: varnet
params:
  checkpoint: ../../../outputs/weights/knee_leaderboard_state_dict.pt
  num_low_frequencies: 48
device: cpu
model:
  axes:
  - batch
  - coil
  - y
  - x
  spatial_shape:
  - 256
  - 256
  sampling: cartesian
  fft_centered: true
  fft_norm: ortho
inputs:
  kspace:
    path: ../../../tests/data/mri/cases/standard_mr_cartesian/public.npz
    key: kspace
  sampling_mask:
    path: ../../../tests/data/mri/cases/standard_mr_cartesian/public.npz
    key: sampling_mask
