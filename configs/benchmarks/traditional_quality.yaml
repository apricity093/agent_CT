schema_version: 1
name: traditional_ct_quality
data_root: ../../tests/data
output_root: ../../artifacts/invct_traditional_quality
device: cuda
overwrite: false
continue_on_error: true
protocol: ../protocols/traditional_quality.yaml
benchmark_protocol: fixed_defaults
groups:
  - algorithms:
      - {name: fbp, config: ../algorithms/fbp.yaml}
      - {name: sirt, config: ../algorithms/sirt.yaml}
      - {name: landweber, config: ../algorithms/landweber.yaml}
      - {name: cgls, config: ../algorithms/cgls.yaml}
      - {name: lsqr, config: ../algorithms/lsqr.yaml}
      - {name: sart, config: ../algorithms/sart.yaml}
      - {name: os_sart, config: ../algorithms/os_sart.yaml}
      - {name: tikhonov, config: ../algorithms/tikhonov.yaml}
      - {name: tv_fista, config: ../algorithms/tv_fista.yaml}
    cases:
      - parallel_2d__ellipses_dense_clean
      - parallel_2d__ellipses_sparse_poisson
      - parallel_2d__ellipses_limited_angle
  - algorithms:
      - {name: fdk, config: ../algorithms/fdk.yaml}
    cases:
      - cone_3d/spheres_astra_12
