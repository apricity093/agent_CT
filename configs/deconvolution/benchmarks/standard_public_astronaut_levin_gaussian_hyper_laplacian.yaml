modality: deconvolution
algorithm: hyper_laplacian
params:
  lam: 0.001
  p: 0.5
  max_iter: 60
device: cpu
inputs:
  observation:
    path: ../../../tests/data/deconvolution/cases/public_astronaut_levin/public.npz
    key: gaussian
  psf:
