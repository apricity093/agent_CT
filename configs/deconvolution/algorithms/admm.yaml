name: admm
modality: deconvolution
implementation_status: implemented
task_types:
- reconstruction
required_inputs:
- observation
- psf
applicability: 2D scalar known PSF, gain=1, background=0
parameters:
  num_iterations: 200
  min_value: null
  max_value: null
  boundary: neumann
  penalize_lowpass: false
  haar_strength: 0.01
  rho_data: null
  rho_regularizer: null
  rho_haar: null
  rho_constraint: null
  regularizer: tikhonov
  strength: 0.01
  tolerance: 1.0e-05
  level: 2
  delta: 0.01
  tv_mode: isotropic
  rho: 1.0
  cg_max_iterations: 100
  cg_tolerance: 1.0e-06
  subproblem_solver: auto
parameter_schema:
  num_iterations:
    type: int
    minimum: 1
    exclusive_minimum: false
  min_value:
    type: float
    nullable: true
  max_value:
    type: float
    nullable: true
  boundary:
    type: str
    choices:
    - neumann
    - periodic
  penalize_lowpass:
    type: bool
  haar_strength:
    type: float
    minimum: 0.0
    exclusive_minimum: false
  rho_data:
    type: float
    nullable: true
    minimum: 0.0
    exclusive_minimum: true
  rho_regularizer:
    type: float
    nullable: true
    minimum: 0.0
    exclusive_minimum: true
  rho_haar:
    type: float
    nullable: true
    minimum: 0.0
    exclusive_minimum: true
  rho_constraint:
    type: float
    nullable: true
    minimum: 0.0
    exclusive_minimum: true
  regularizer:
    type: str
    choices:
    - none
    - tikhonov
    - tv
    - h1
    - huber
    - gradient_huber
    - haar_l1
    - tv_haar
  strength:
    type: float
    minimum: 0.0
    exclusive_minimum: false
  tolerance:
    type: float
    minimum: 0.0
    exclusive_minimum: false
  level:
    type: int
    minimum: 1
    exclusive_minimum: false
  delta:
    type: float
    minimum: 0.0
    exclusive_minimum: true
  tv_mode:
    type: str
    choices:
    - isotropic
    - anisotropic
  rho:
    type: float
    minimum: 0.0
    exclusive_minimum: true
  cg_max_iterations:
    type: int
    minimum: 1
    exclusive_minimum: false
  cg_tolerance:
    type: float
    minimum: 0.0
    exclusive_minimum: true
  subproblem_solver:
    type: str
    choices:
    - auto
    - cg
    - fft
devices:
- cpu
spatial_dimensions:
- 2
objective: 0.5 sum W |Ax-y|^2 + strength R(x), optional real box; TV+Haar uses separate haar_strength
unsupported: Poisson remains on existing dedicated paths; joint TV+Haar only ADMM;
  MRI has no real box.
outputs:
- reconstruction
boundaries:
- periodic
- zero
